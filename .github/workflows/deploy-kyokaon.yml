name: Deploy kyo-kaon theme

# kyo-kaon.jp の子テーマに変更があった時だけ、FTPS(暗号化FTP)で本番へ反映する。
#
# ★本番で動いているのは welcart_basic-beldad（Welcart Basic の子テーマ）。
#   Welcart のテンプレート上書き（wc_templates/）と業務ロジック（functions.php）が入っている。
#
# ★公開フォルダ名はドメイン名と違う。
#   ドメイン kyo-kaon.jp → サーバー上のフォルダは kaon/
#
# ★★server-dir は「/kaon/」で始める。「/web/kaon/」ではない。★★
#   このFTPアカウントのログイン直後の位置が既に web/ の中なので、
#   /web/kaon/ と書くと web/web/kaon/ という別フォルダが作られ、
#   **Actionsは緑（成功）になるのに本番には一切反映されない。**
#   2026-09-08〜09-14 の間、実際にこれで2回とも空振りしていた。
#
#   確認方法：デプロイ後に
#     https://kyo-kaon.jp/wp-content/themes/welcart_basic-beldad/style.css
#   の Last-Modified が今の日時になっているか見る。
#   「200が返ること」は確認にならない（元からあるファイルなので当然200）。
#
# uploads・WordPress本体・プラグイン・DBには一切触れない。

on:
  push:
    branches: [ master ]
    paths:
      - 'kyo-kaon.jp/wp-content/themes/welcart_basic-beldad/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./kyo-kaon.jp/wp-content/themes/welcart_basic-beldad/
          server-dir: /kaon/wp-content/themes/welcart_basic-beldad/
